<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Impresión 3D</title>

<link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020617">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="container">

<header>

<img src="logo.png" class="logo">
<h1>Calculadora Impresión 3D</h1>

</header>

<div class="grid">

<div class="panel">

<h3>Datos del trabajo</h3>

<label>Cliente</label>
<input id="cliente">

<label>Material</label>
<select id="material"></select>

<label>Gramos</label>
<input id="gramos" type="number">

<label>Horas</label>
<input id="horas" type="number">

<label>Minutos</label>
<input id="minutos" type="number">

<button id="calcular">Calcular</button>

<div id="resultado"></div>

<h2 id="precioFinal"></h2>

<h3>Referencia de precios</h3>

<div id="cotizacion"></div>

<button id="pdf">Descargar PDF</button>

<button id="whatsapp">Enviar por WhatsApp</button>

</div>


<div class="panel">

<h3>Gastos</h3>

<label>Precio Kwh</label>
<input id="precioLuz" value="500">

<label>Consumo impresora (W)</label>
<input id="consumo" value="300">

<label>Repuestos</label>
<input id="repuestos" value="150000">

<label>Vida útil (horas)</label>
<input id="vida" value="4320">

<label>Insumos</label>
<input id="insumos" value="0">

<label>% fallos</label>
<input id="fallos" value="10">

<label>Precio mínimo</label>
<input id="minimo" value="1000">

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
