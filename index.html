<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="logoTitulo">

<img src="logo.png" class="logo">

<h1>Calculadora Profesional de Impresión 3D</h1>

</div>


<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<header>

<h1>Calculadora Profesional de Impresión 3D</h1>

</header>

<div class="container">

<div class="card">

<h2>Datos del trabajo</h2>

<label>Cliente</label>
<input id="cliente" placeholder="Nombre del cliente">

<label>Material</label>
<select id="material"></select>

<label>Gramos usados</label>
<input type="number" id="gramos">

<label>Tiempo de impresión</label>

<div class="time">

<input id="horas" type="number" placeholder="Horas">
<input id="minutos" type="number" placeholder="Minutos">

</div>

</div>

<div class="card">

<h2>Configuración</h2>

<label>Precio electricidad</label>
<input id="luz" value="500">

<label>Costo máquina por hora</label>
<input id="maquina" value="300">

<label>Costo por fallos (%)</label>
<input id="fallos" value="10">

<label>Precio mínimo por trabajo</label>
<input id="minimoTrabajo" value="3000">

<button id="calcular">Calcular precio</button>

</div>

<div class="card">

<h2>Resultado</h2>

<div id="resultado"></div>

<p>Precio sugerido: <span id="precioMin"></span></p>

<button id="pdf">Descargar presupuesto PDF</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
